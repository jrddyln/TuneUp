<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/TuneUp/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="TuneUp - Professional Binaural Beat Generator with Real-Time Visualization">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TuneUp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>TuneUp - TuneUp - Audio Frequency Tool</title>
  <link rel="manifest" href="manifest.json">

  <!-- Binaural Beat Audio Engine -->
  <script src="audio_engine.js"></script>

  <!-- Orientation and Full-Screen Helper -->
  <script>
    // Check if running in iframe (Wix embedding)
    window.isInIframe = function() {
      try {
        return window.self !== window.top;
      } catch (e) {
        return true;
      }
    };
    
    // Open app in new full-screen window
    window.openFullScreen = function() {
      var url = window.location.href;
      var width = screen.width;
      var height = screen.height;
      var features = 'width=' + width + ',height=' + height + ',fullscreen=yes,location=no,menubar=no,toolbar=no,status=no';
      var newWin = window.open(url, '_blank', features);
      if (newWin) {
        newWin.focus();
        // Try to request fullscreen API
        setTimeout(function() {
          if (newWin.document && newWin.document.documentElement) {
            var elem = newWin.document.documentElement;
            if (elem.requestFullscreen) {
              elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
              elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
              elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
              elem.msRequestFullscreen();
            }
          }
        }, 500);
      }
      return newWin;
    };
  </script>

  <!-- Keyboard Shortcut Handler -->
  <script>
    // Global function that Flutter will register
    window.toggleAudioFromKeyboard = null;
    
    // Spacebar handler
    document.addEventListener('keydown', function(event) {
      if (event.key === ' ' || event.code === 'Space' || event.keyCode === 32) {
        const activeElement = document.activeElement;
        if (activeElement && (
          activeElement.tagName === 'INPUT' || 
          activeElement.tagName === 'TEXTAREA' ||
          activeElement.isContentEditable
        )) {
          return;
        }
        
        event.preventDefault();
        event.stopPropagation();
        
        // Call Flutter's toggle function if available
        if (window.toggleAudioFromKeyboard) {
          window.toggleAudioFromKeyboard();
        }
      }
    }, true);
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "2910896746";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
